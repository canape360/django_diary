{% extends 'base.html' %}

{% block title %}{{ diary.title }} | Django Diary{% endblock %}

{% block content %}
<div style="margin-bottom:1rem;">
  <a href="{% url 'diary_list' %}" class="text-muted" style="font-size:0.88rem;">← 一覧に戻る</a>
</div>

<div class="diary-detail">
  <h1>{{ diary.title }}</h1>
  <div class="diary-detail__meta">
    📅 {{ diary.date|date:"Y年n月j日 (D)" }}
  </div>
  <div class="diary-detail__body">{{ diary.body }}</div>

  <hr class="divider">

  <div class="card__actions">
    <a href="{% url 'diary_edit' diary.pk %}" class="btn btn-secondary">✏️ 編集</a>
    <a href="{% url 'diary_delete' diary.pk %}" class="btn btn-danger">🗑️ 削除</a>
  </div>
</div>
{% endblock %}
