{% extends 'base.html' %}

{% block title %}新しい日記 | Django Diary{% endblock %}

{% block content %}
<div style="margin-bottom:1rem;">
  <a href="/wholediary/" class="text-muted" style="font-size:0.88rem;">← 一覧に戻る</a>
</div>

<h1>✏️ 新しい日記</h1>

<div class="card">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          {% for error in field.errors %}
            <p style="color:var(--color-danger); font-size:0.82rem; margin-top:0.3rem;">{{ error }}</p>
          {% endfor %}
        {% endif %}
      </div>
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">💾 保存する</button>
      <a href="/wholediary/" class="btn btn-secondary">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
