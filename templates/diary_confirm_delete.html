{% extends 'base.html' %}

{% block title %}削除の確認 | Django Diary{% endblock %}

{% block content %}
<h1>🗑️ 日記を削除</h1>

<div class="card" style="text-align:center;">
  <p style="font-size:1.5rem; margin-bottom:0.75rem;">⚠️</p>
  <p style="margin-bottom:0.5rem; font-weight:500;">以下の日記を削除しますか？</p>
  <p class="text-muted" style="margin-bottom:1.5rem;">「{{ diary.title }}」</p>
  <p class="text-muted" style="font-size:0.85rem; margin-bottom:1.5rem;">この操作は取り消せません。</p>

  <form method="post">
    {% csrf_token %}
    <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
      <button type="submit" class="btn btn-danger">削除する</button>
      <a href="{% url 'diary_list' %}" class="btn btn-secondary">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
