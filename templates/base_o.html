{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Django Diary</title>
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/resort.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="site-header">
  <div class="header-inner">
    <h1 class="logo">🌴 Django Diary</h1>
    <nav class="nav">
      <a href="{% url 'myapp:home' %}">Home</a>
      <a href="{% url 'myapp:wholediary' %}">Diary</a>
      <a href="{% url 'myapp:diary_create' %}">New</a>

      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
      </form>
      {% else %}
      <a href="{% url 'login' %}">Login</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="site-main">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <nav>
    <a href="{% url 'myapp:privacy' %}">プライバシーポリシー</a>
    <span>｜</span>
    <a href="{% url 'myapp:disclaimer' %}">免責事項</a>
  </nav>
</footer>

</body>
</html>
